<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer">
    
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <title>UlpanLearn</title>

    <script>
      window.pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.pwaInstallPrompt = e;
        console.log("⚡ ГЛОБАЛЬНАЯ ЛОВУШКА: Событие установки поймано!");
        window.dispatchEvent(new Event('pwa-ready'));
      });
    </script>

    <style>
      body {
        margin: 0;
        background-color: #f8fafc;
      }
      .static-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        font-family: 'Fredoka', sans-serif; 
      }
      .ulpan-loader {
        position: relative;
        width: 140px;
        height: 60px;
        margin-bottom: 40px;
        transform: scale(1.5);
      }
      .loader-road {
        position: absolute;
        bottom: 5px;
        left: 0;
        width: 100%;
        height: 4px;
        background: #22c55e;
        border-radius: 2px;
      }
      .loader-school {
        position: absolute;
        bottom: 5px;
        right: 0;
        font-size: 38px;
        z-index: 1;
      }
      .loader-owl {
        position: absolute;
        bottom: 8px;
        left: 0;
        font-size: 30px;
        animation: walkToUlpan 1.5s ease-in-out infinite;
        z-index: 2;
      }
      @keyframes walkToUlpan {
        0% { left: 0; transform: translateY(0); opacity: 1; }
        15% { transform: translateY(-18px); }
        30% { left: 35px; transform: translateY(0); }
        45% { transform: translateY(-18px); }
        60% { left: 70px; transform: translateY(0); }
        75% { transform: translateY(-18px); }
        85% { left: 95px; transform: translateY(0); opacity: 1; }
        95% { left: 95px; transform: translateY(0); opacity: 0; }
        100% { left: 0; transform: translateY(0); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      
      <div class="static-loader">
        <div class="ulpan-loader">
          <div class="loader-owl">🦉</div>
          <div class="loader-school">🏫</div>
          <div class="loader-road"></div>
        </div>
        <h1 style="color: #22c55e; font-size: 32px; margin: 0 0 10px 0;">UlpanLearn</h1>
        <div style="color: #64748b; font-weight: 500;">Запускаем приложение...</div>
      </div>

    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
